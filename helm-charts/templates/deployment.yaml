apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pharma-app.fullname" . }}
  labels:
    {{- include "pharma-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pharma-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pharma-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ default (include "pharma-app.fullname" .) .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pharma-app.fullname" . }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $live := .Values.livenessProbe | default .Values.probes.liveness }}
          {{- $ready := .Values.readinessProbe | default .Values.probes.readiness }}
          livenessProbe:
            httpGet:
              path: {{ $live.path }}
              port: {{ $live.port | default .Values.service.targetPort }}
            {{- with $live.initialDelaySeconds }}
            initialDelaySeconds: {{ . }}
            {{- end }}
            {{- with $live.periodSeconds }}
            periodSeconds: {{ . }}
            {{- end }}
            {{- with $live.timeoutSeconds }}
            timeoutSeconds: {{ . }}
            {{- end }}
            {{- with $live.failureThreshold }}
            failureThreshold: {{ . }}
            {{- end }}
            {{- with $live.successThreshold }}
            successThreshold: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $ready.path }}
              port: {{ $ready.port | default .Values.service.targetPort }}
            {{- with $ready.initialDelaySeconds }}
            initialDelaySeconds: {{ . }}
            {{- end }}
            {{- with $ready.periodSeconds }}
            periodSeconds: {{ . }}
            {{- end }}
            {{- with $ready.timeoutSeconds }}
            timeoutSeconds: {{ . }}
            {{- end }}
            {{- with $ready.failureThreshold }}
            failureThreshold: {{ . }}
            {{- end }}
            {{- with $ready.successThreshold }}
            successThreshold: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
