apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-ui
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharma-ui
  template:
    metadata:
      labels:
        app: pharma-ui
    spec:
      serviceAccountName: pharma-ui
      containers:
        - name: pharma-ui
          image: 683604924610.dkr.ecr.us-east-1.amazonaws.com/pharma-ui:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: pharma-ui-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
