replicaCount: 2

image:
  repository: 683604924610.dkr.ecr.us-east-1.amazonaws.com/pharma-ui
  tag: sha-0481fbf
  pullPolicy: Always

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: pharma-dev
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

config:
  API_BASE_URL: "/api"
  AUTH_BASE_URL: "/api/auth"
  ENV: "dev"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /
    port: 80
  readiness:
    path: /
    port: 80

autoscaling:
  enabled: false

securityContext:
  runAsNonRoot: false
  readOnlyRootFilesystem: false


