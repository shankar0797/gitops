replicaCount: 1
fullnameOverride: drug-catalog-service
image:
  repository: "683604924610.dkr.ecr.us-east-1.amazonaws.com/drug-catalog-service"
  tag: sha-a93dc4f
  pullPolicy: Always
serviceAccount:
  create: true
  name: drug-catalog-service
  annotations: {}
service:
  type: ClusterIP
  port: 8082
  targetPort: 8082
ingress:
  enabled: false
  className: alb
  annotations: {}
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
livenessProbe:
  path: "/actuator/health"
  port: 8082
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  path: "/actuator/health/readiness"
  port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
configmap:
  SPRING_PROFILES_ACTIVE: dev
  LOG_LEVEL: DEBUG
  SERVER_PORT: "8082"
envFrom:
  - secretRef:
      name: db-credentials
volumeMounts:
  - name: tmp
    mountPath: /tmp
volumes:
  - name: tmp
    emptyDir: {}
